<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
<title id="title">Small Pony - always building</title><desc id="desc">A white editorial profile. Software, systems, data, and intelligence. Select a chapter logo panel to reveal its animated visual.</desc>
<defs><pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#d9dde4"/></pattern></defs>
<style>
text{font-family:Inter,'Segoe UI',Arial,sans-serif}
.mono{font-family:Consolas,monospace;letter-spacing:2px}
.flow{stroke-dasharray:16 88;animation:flow 5s linear infinite}
.float{animation:float 5s ease-in-out infinite}
.pulse{animation:pulse 3.6s ease-in-out infinite}
.rotate{transform-box:fill-box;transform-origin:center;animation:rotate 32s linear infinite}
.dot{animation:particle 4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-208}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes rotate{to{transform:rotate(360deg)}}
@keyframes particle{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-9px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="960" height="510" fill="#fff"/>
<text x="40" y="42" fill="#151821" font-size="14" font-weight="700" letter-spacing="3">SMALL PONY</text><text x="40" y="70" fill="#67717e" font-size="9" font-weight="400" class="mono">ENGINEERING / A CONTINUING PRACTICE</text><text x="34" y="174" fill="#151821" font-size="90" font-weight="700" letter-spacing="-5">Always</text><text x="34" y="265" fill="#151821" font-size="90" font-weight="700" letter-spacing="-5">building.</text><text x="40" y="316" fill="#67717e" font-size="21" font-weight="400" >From the web to intelligent systems.</text><circle cx="742" cy="230" r="162" fill="url(#grid)"/><g transform="translate(742 230)"><g class="rotate"><ellipse rx="140" ry="46.2" fill="none" stroke="#3158ed" stroke-width="1.7" transform="rotate(0)"/><ellipse rx="96.6" ry="31.878" fill="none" stroke="#ef553d" stroke-width="1.7" transform="rotate(60)"/><ellipse rx="51.8" ry="17.094" fill="none" stroke="#151821" stroke-width="1.7" transform="rotate(120)"/></g><circle r="6" fill="#3158ed" class="pulse"/></g><circle cx="43" cy="394" r="3" fill="#151821"/><text x="54" y="398" fill="#67717e" font-size="10" font-weight="400" letter-spacing="1.3">SOFTWARE</text><circle cx="269" cy="394" r="3" fill="#3158ed"/><text x="280" y="398" fill="#67717e" font-size="10" font-weight="400" letter-spacing="1.3">SYSTEMS</text><circle cx="495" cy="394" r="3" fill="#ef553d"/><text x="506" y="398" fill="#67717e" font-size="10" font-weight="400" letter-spacing="1.3">DATA</text><circle cx="721" cy="394" r="3" fill="#097e72"/><text x="732" y="398" fill="#67717e" font-size="10" font-weight="400" letter-spacing="1.3">INTELLIGENCE</text><path d="M40 455H920" stroke="#dce0e7"/><text x="40" y="487" fill="#3158ed" font-size="9" font-weight="400" letter-spacing="1.3">SELECT A CHAPTER TO REVEAL ITS MOTION</text>
</svg>