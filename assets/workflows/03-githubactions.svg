<svg xmlns="http://www.w3.org/2000/svg" width="960" height="456" viewBox="0 0 960 456" role="img" aria-labelledby="title desc">
<title id="title">GitHub Actions - An event triggers jobs and promotes an artifact</title><desc id="desc">An event triggers jobs and promotes an artifact. Push / PR -&gt; Test job -&gt; Build artifact -&gt; Deploy job. Illustrative workflow.</desc>
