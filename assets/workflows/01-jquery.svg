<svg xmlns="http://www.w3.org/2000/svg" width="960" height="456" viewBox="0 0 960 456" role="img" aria-labelledby="title desc">
<title id="title">jQuery - Select elements, handle events, update the DOM</title><desc id="desc">Select elements, handle events, update the DOM. CSS selector -&gt; Matched nodes -&gt; Event handler -&gt; DOM update. Illustrative workflow.</desc>
