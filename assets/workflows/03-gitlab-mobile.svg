<title id="title">GitLab - A delivery pipeline publishes and deploys an image</title><desc id="desc">A delivery pipeline publishes and deploys an image. Commit -&gt; CI pipeline -&gt; Image registry -&gt; Deploy. Illustrative workflow.</desc>
