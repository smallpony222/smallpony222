ze="20" font-weight="600" text-anchor="middle">Loss</text><rect x="655.0" y="275" width="174" height="74" rx="14" fill="none" stroke="#d4482f" class="stage" style="animation-delay:-3.8s"/><text x="742" y="319.0" fill="#797979" font-size="20" font-weight="600" text-anchor="middle">Backward</text><rect x="131.0" y="275" width="174" height="74" rx="14" fill="none" stroke="#d4482f" class="stage" style="animation-delay:-5.699999999999999s"/><text x="218" y="319.0" fill="#797979" font-size="20" font-weight="600" text-anchor="middle">Optimizer</text><text x="218" y="385" fill="#d4482f" font-size="19" font-weight="600" text-anchor="middle">weight update</text><text x="28" y="410" fill="#797979" font-size="19" font-weight="600" >Gradients flow backward before the optimizer step</text>
