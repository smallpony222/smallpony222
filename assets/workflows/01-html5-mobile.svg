n-delay:-7.6s"/><text x="86" y="499.0" fill="#797979" font-size="16" font-weight="600" text-anchor="middle">main</text><rect x="14" y="566" width="144" height="68" rx="10" fill="none" stroke="#e34f26" class="stage" style="animation-delay:-9.5s"/><text x="86" y="606.0" fill="#797979" font-size="16" font-weight="600" text-anchor="middle">footer</text>
</svg>