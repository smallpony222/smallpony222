<svg xmlns="http://www.w3.org/2000/svg" width="180" height="663" viewBox="0 0 180 663" role="img" aria-labelledby="title desc">
<title id="title">HTML5 - Markup becomes a document tree</title><desc id="desc">Markup becomes a document tree. Compact stacked layout preserves dependencies and feedback paths.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#828282" stroke-width="1.2"/></marker></defs>
<style>
text{font-family:Inter,'Segoe UI',Arial,sans-serif}
.flow{stroke-dasharray:8 28;animation:flow 4s linear infinite}
.stage{animation:stage 8s ease-in-out infinite}
.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 32s linear infinite}
@keyframes flow{to{stroke-dashoffset:-144}}
@keyframes stage{0%,20%{stroke-width:3}40%,100%{stroke-width:1.2}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes grid{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.58)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
