tage" style="animation-delay:-1.9s"/><text x="130" y="257.0" fill="#797979" font-size="20" font-weight="600" text-anchor="middle">head</text><rect x="292.0" y="213" width="116" height="74" rx="14" fill="none" stroke="#e34f26" class="stage" style="animation-delay:-3.8s"/><text x="350" y="257.0" fill="#797979" font-size="20" font-weight="600" text-anchor="middle">body</text><rect x="17.0" y="346" width="116" height="74" rx="14" fill="none" stroke="#e34f26" class="stage" style="animation-delay:-5.699999999999999s"/><text x="75" y="390.0" fill="#797979" font-size="20" font-weight="600" text-anchor="middle">title</text><rect x="182.0" y="346" width="116" height="74" rx="14" fill="none" stroke="#e34f26" class="stage" style="animation-delay:-7.6s"/><text x="240" y="390.0" fill="#797979" font-size="20" font-weight="600" text-anchor="middle">main</text><rect x="347.0" y="346" width="116" height="74" rx="14" fill="none" stroke="#e34f26" class="stage" style="animation-delay:-9.5s"/><text x="405" y="390.0" fill="#797979" font-size="20" font-weight="600" text-anchor="middle">footer</text><text x="28" y="500" fill="#797979" font-size="19" font-weight="600" >Markup becomes a document tree</text>
