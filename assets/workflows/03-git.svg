hor="middle">Feature commits</text><rect x="353.0" y="281" width="174" height="74" rx="14" fill="none" stroke="#e64d30" class="stage" style="animation-delay:-3.8s"/><text x="440" y="325.0" fill="#797979" font-size="20" font-weight="600" text-anchor="middle">Review</text><rect x="743.0" y="188" width="174" height="74" rx="14" fill="none" stroke="#e64d30" class="stage" style="animation-delay:-5.699999999999999s"/><text x="830" y="232.0" fill="#797979" font-size="20" font-weight="600" text-anchor="middle">Merge commit</text><text x="28" y="410" fill="#797979" font-size="19" font-weight="600" >Feature work diverges and merges back</text>
