><text x="350" y="350.0" fill="#797979" font-size="20" font-weight="600" text-anchor="middle">Update weights</text><rect x="43.0" y="306" width="174" height="74" rx="14" fill="none" stroke="#c56b00" class="stage" style="animation-delay:-5.699999999999999s"/><text x="130" y="350.0" fill="#797979" font-size="20" font-weight="600" text-anchor="middle">Saved model</text><text x="130" y="416" fill="#c56b00" font-size="19" font-weight="600" text-anchor="middle">weight update</text><text x="28" y="500" fill="#797979" font-size="19" font-weight="600" >Batches train a graph and produce a</text><text x="28" y="526" fill="#797979" font-size="19" font-weight="600" >serving model</text>
