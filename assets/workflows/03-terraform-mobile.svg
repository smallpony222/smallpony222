<svg xmlns="http://www.w3.org/2000/svg" width="480" height="572" viewBox="0 0 480 572" role="img" aria-labelledby="title desc">
<title id="title">Terraform - A plan applies a resource graph and updates state</title><desc id="desc">A plan applies a resource graph and updates state. Configuration -&gt; Plan -&gt; Apply resources -&gt; State. Illustrative workflow.</desc>
