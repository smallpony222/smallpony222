ke="#e34f26" class="stage" style="animation-delay:-1.9s"/><text x="270" y="232.0" fill="#797979" font-size="20" font-weight="600" text-anchor="middle">head</text><rect x="607.0" y="188" width="166" height="74" rx="14" fill="none" stroke="#e34f26" class="stage" style="animation-delay:-3.8s"/><text x="690" y="232.0" fill="#797979" font-size="20" font-weight="600" text-anchor="middle">body</text><rect x="77.0" y="298" width="166" height="74" rx="14" fill="none" stroke="#e34f26" class="stage" style="animation-delay:-5.699999999999999s"/><text x="160" y="342.0" fill="#797979" font-size="20" font-weight="600" text-anchor="middle">title</text><rect x="397.0" y="298" width="166" height="74" rx="14" fill="none" stroke="#e34f26" class="stage" style="animation-delay:-7.6s"/><text x="480" y="342.0" fill="#797979" font-size="20" font-weight="600" text-anchor="middle">main</text><rect x="717.0" y="298" width="166" height="74" rx="14" fill="none" stroke="#e34f26" class="stage" style="animation-delay:-9.5s"/><text x="800" y="342.0" fill="#797979" font-size="20" font-weight="600" text-anchor="middle">footer</text><text x="28" y="410" fill="#797979" font-size="19" font-weight="600" >Markup becomes a document tree</text>
