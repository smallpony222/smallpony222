<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
<title id="title">Small Pony - engineering journey</title><desc id="desc">Always building. Select individual technology logos for their conceptual workflows.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#828282" stroke-width="1.2"/></marker></defs>
<style>
text{font-family:Inter,'Segoe UI',Arial,sans-serif}
.flow{stroke-dasharray:8 28;animation:flow 4s linear infinite}
.stage{animation:stage 8s ease-in-out infinite}
.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 32s linear infinite}
@keyframes flow{to{stroke-dashoffset:-144}}
@keyframes stage{0%,20%{stroke-width:3}40%,100%{stroke-width:1.2}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes grid{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.58)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<text x="25" y="50" fill="#797979" font-size="20" font-weight="700" letter-spacing="4">SMALL PONY</text><text x="22" y="127" fill="#797979" font-size="72" font-weight="700" letter-spacing="-2">Always building.</text><text x="26" y="176" fill="#797979" font-size="24" font-weight="600" >Software. Systems. Data. Applied AI.</text><g transform="translate(800 159)"><g class="orbit"><ellipse rx="110" ry="35.2" transform="rotate(0)" fill="none" stroke="#5976d4" stroke-width="2"/><ellipse rx="110" ry="35.2" transform="rotate(60)" fill="none" stroke="#cb6239" stroke-width="2"/><ellipse rx="110" ry="35.2" transform="rotate(120)" fill="none" stroke="#797979" stroke-width="2"/></g></g><text x="26" y="294" fill="#5976d4" font-size="19" font-weight="600" >SELECT A LOGO TO EXPLORE ITS WORKFLOW</text>
</svg>