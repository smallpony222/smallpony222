<svg xmlns="http://www.w3.org/2000/svg" width="180" height="449" viewBox="0 0 180 449" role="img" aria-labelledby="title desc">
<title id="title">PostgreSQL - Analytical SQL groups and aggregates rows</title><desc id="desc">Analytical SQL groups and aggregates rows. Compact stacked layout preserves dependencies and feedback paths.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#828282" stroke-width="1.2"/></marker></defs>
<style>
text{font-family:Inter,'Segoe UI',Arial,sans-serif}
.flow{stroke-dasharray:8 28;animation:flow 4s linear infinite}
.stage{animation:stage 8s ease-in-out infinite}
.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 32s linear infinite}
@keyframes flow{to{stroke-dashoffset:-144}}
@keyframes stage{0%,20%{stroke-width:3}40%,100%{stroke-width:1.2}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes grid{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.58)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<path d="M86 99V138" stroke="#828282" fill="none" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M86 99V138" stroke="#5478ab" fill="none" stroke-width="2.5" class="flow"/><path d="M86 206V245" stroke="#828282" fill="none" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M86 206V245" stroke="#5478ab" fill="none" stroke-width="2.5" class="flow"/><path d="M86 313V352" stroke="#828282" fill="none" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M86 313V352" stroke="#5478ab" fill="none" stroke-width="2.5" class="flow"/><rect x="14" y="31" width="144" height="68" rx="10" fill="none" stroke="#5478ab" class="stage" style="animation-delay:-0.0s"/><text x="86" y="71.0" fill="#797979" font-size="16" font-weight="600" text-anchor="middle">Analytical SQL</text><rect x="14" y="138" width="144" height="68" rx="10" fill="none" stroke="#5478ab" class="stage" style="animation-delay:-1.9s"/><text x="86" y="178.0" fill="#797979" font-size="16" font-weight="600" text-anchor="middle">Partition scan</text><rect x="14" y="245" width="144" height="68" rx="10" fill="none" stroke="#5478ab" class="stage" style="animation-delay:-3.8s"/><text x="86" y="285.0" fill="#797979" font-size="16" font-weight="600" text-anchor="middle">Aggregate</text><rect x="14" y="352" width="144" height="68" rx="10" fill="none" stroke="#5478ab" class="stage" style="animation-delay:-5.699999999999999s"/><text x="86" y="392.0" fill="#797979" font-size="16" font-weight="600" text-anchor="middle">Result set</text>
</svg>