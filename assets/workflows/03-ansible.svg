<svg xmlns="http://www.w3.org/2000/svg" width="960" height="456" viewBox="0 0 960 456" role="img" aria-labelledby="title desc">
<title id="title">Ansible - A playbook converges hosts toward a declared state</title><desc id="desc">A playbook converges hosts toward a declared state. Inventory -&gt; Playbook -&gt; Host A -&gt; Host B. Illustrative workflow.</desc>
