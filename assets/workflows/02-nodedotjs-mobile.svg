<title id="title">Node.js - Async I/O returns callbacks to the event loop</title><desc id="desc">Async I/O returns callbacks to the event loop. Request -&gt; Async I/O -&gt; Callback queue -&gt; Event loop. Illustrative workflow.</desc>
