<svg xmlns="http://www.w3.org/2000/svg" width="480" height="572" viewBox="0 0 480 572" role="img" aria-labelledby="title desc">
<title id="title">PyTorch - Gradients flow backward before the optimizer step</title><desc id="desc">Gradients flow backward before the optimizer step. Forward pass -&gt; Loss -&gt; Backward -&gt; Optimizer. Illustrative workflow.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#828282" stroke-width="1.2"/></marker></defs>
<style>
text{font-family:Inter,'Segoe UI',Arial,sans-serif}
.flow{stroke-dasharray:8 28;animation:flow 4s linear infinite}
.stage{animation:stage 8s ease-in-out infinite}
.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 32s linear infinite}
@keyframes flow{to{stroke-dashoffset:-144}}
@keyframes stage{0%,20%{stroke-width:3}40%,100%{stroke-width:1.2}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes grid{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.58)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g transform="translate(28 23) scale(1.25)" fill="#d4482f"><path d="M12.005 0L4.952 7.053a9.865 9.865 0 000 14.022 9.866 9.866 0 0014.022 0c3.984-3.9 3.986-10.205.085-14.023l-1.744 1.743c2.904 2.905 2.904 7.634 0 10.538s-7.634 2.904-10.538 0-2.904-7.634 0-10.538l4.647-4.646.582-.665zm3.568 3.899a1.327 1.327 0 00-1.327 1.327 1.327 1.327 0 001.327 1.328A1.327 1.327 0 0016.9 5.226 1.327 1.327 0 0015.573 3.9z"/></g><text x="73" y="47" fill="#797979" font-size="24" font-weight="700" >PyTorch</text><text x="28" y="85" fill="#d4482f" font-size="19" font-weight="600" >AUTOGRAD AND OPTIMIZER</text><path d="M221.00 163.00Q240.00 163.00 259.00 163.00" fill="none" stroke="#828282" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M221.00 163.00Q240.00 163.00 259.00 163.00" fill="none" stroke="#d4482f" stroke-width="2.5" class="flow"/><path d="M350.00 209.00Q350.00 253.00 350.00 297.00" fill="none" stroke="#828282" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M350.00 209.00Q350.00 253.00 350.00 297.00" fill="none" stroke="#d4482f" stroke-width="2.5" class="flow"/><path d="M259.00 343.00Q240.00 343.00 221.00 343.00" fill="none" stroke="#828282" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M259.00 343.00Q240.00 343.00 221.00 343.00" fill="none" stroke="#d4482f" stroke-width="2.5" class="flow"/><path d="M130.00 297.00Q130.00 253.00 130.00 209.00" fill="none" stroke="#828282" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M130.00 297.00Q130.00 253.00 130.00 209.00" fill="none" stroke="#d4482f" stroke-width="2.5" class="flow"/><rect x="43.0" y="126" width="174" height="74" rx="14" fill="none" stroke="#d4482f" class="stage" style="animation-delay:-0.0s"/><text x="130" y="170.0" fill="#797979" font-size="20" font-weight="600" text-anchor="middle">Forward pass</text><rect x="263.0" y="126" width="174" height="74" rx="14" fill="none" stroke="#d4482f" class="stage" style="animation-delay:-1.9s"/><text x="350" y="170.0" fill="#797979" font-size="20" font-weight="600" text-anchor="middle">Loss</text><rect x="263.0" y="306" width="174" height="74" rx="14" fill="none" stroke="#d4482f" class="stage" style="animation-delay:-3.8s"/><text x="350" y="350.0" fill="#797979" font-size="20" font-weight="600" text-anchor="middle">Backward</text><rect x="43.0" y="306" width="174" height="74" rx="14" fill="none" stroke="#d4482f" class="stage" style="animation-delay:-5.699999999999999s"/><text x="130" y="350.0" fill="#797979" font-size="20" font-weight="600" text-anchor="middle">Optimizer</text><text x="130" y="416" fill="#d4482f" font-size="19" font-weight="600" text-anchor="middle">weight update</text><text x="28" y="500" fill="#797979" font-size="19" font-weight="600" >Gradients flow backward before the</text><text x="28" y="526" fill="#797979" font-size="19" font-weight="600" >optimizer step</text>
</svg>