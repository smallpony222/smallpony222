re commits</text><rect x="263.0" y="230" width="174" height="74" rx="14" fill="none" stroke="#e64d30" class="stage" style="animation-delay:-3.8s"/><text x="350" y="274.0" fill="#797979" font-size="20" font-weight="600" text-anchor="middle">Review</text><rect x="153.0" y="377" width="174" height="74" rx="14" fill="none" stroke="#e64d30" class="stage" style="animation-delay:-5.699999999999999s"/><text x="240" y="421.0" fill="#797979" font-size="20" font-weight="600" text-anchor="middle">Merge commit</text><text x="28" y="500" fill="#797979" font-size="19" font-weight="600" >Feature work diverges and merges back</text>
