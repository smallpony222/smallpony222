<svg xmlns="http://www.w3.org/2000/svg" width="480" height="174" viewBox="0 0 480 174" role="img" aria-labelledby="title desc">
<title id="title">2023 - 2025 / Data, in motion.</title><desc id="desc">Data engineering / ETL / ELT</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#828282" stroke-width="1.2"/></marker></defs>
<style>
text{font-family:Inter,'Segoe UI',Arial,sans-serif}
.flow{stroke-dasharray:8 28;animation:flow 4s linear infinite}
.stage{animation:stage 8s ease-in-out infinite}
.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 32s linear infinite}
@keyframes flow{to{stroke-dashoffset:-144}}
@keyframes stage{0%,20%{stroke-width:3}40%,100%{stroke-width:1.2}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes grid{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.58)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<path d="M18 24V150" stroke="#1a877c" stroke-width="3"/><text x="40" y="47" fill="#1a877c" font-size="18" font-weight="700" letter-spacing="2">2023 - 2025</text><text x="38" y="96" fill="#797979" font-size="30" font-weight="700" letter-spacing="-1">Data, in motion.</text><text x="443" y="47" fill="#1a877c" font-size="22" font-weight="600" text-anchor="end">04</text><text x="40" y="130" fill="#797979" font-size="18" font-weight="600" >Data engineering / ETL / ELT</text>
</svg>