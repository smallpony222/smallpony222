<svg xmlns="http://www.w3.org/2000/svg" width="960" height="456" viewBox="0 0 960 456" role="img" aria-labelledby="title desc">
<title id="title">Kafka - Partitioned event logs feed consumers with offsets</title><desc id="desc">Partitioned event logs feed consumers with offsets. Producer -&gt; Topic / P0 -&gt; Topic / P1 -&gt; Consumer group. Illustrative workflow.</desc>
