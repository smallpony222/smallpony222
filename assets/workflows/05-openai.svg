<svg xmlns="http://www.w3.org/2000/svg" width="960" height="456" viewBox="0 0 960 456" role="img" aria-labelledby="title desc">
<title id="title">OpenAI - Example application: model requests a tool, then continues</title><desc id="desc">Example application: model requests a tool, then continues. Prompt + context -&gt; Model response -&gt; Tool execution -&gt; Tool result. Illustrative workflow.</desc>
