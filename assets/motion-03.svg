<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
<title id="title">Built to keep running. Animated motion study</title><desc id="desc">BUILD / TEST / DEPLOY / OBSERVE. Decorative conceptual animation, not live metrics.</desc>
<defs><pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#d9dde4"/></pattern></defs>
<style>
text{font-family:Inter,'Segoe UI',Arial,sans-serif}
.mono{font-family:Consolas,monospace;letter-spacing:2px}
.flow{stroke-dasharray:16 88;animation:flow 5s linear infinite}
.float{animation:float 5s ease-in-out infinite}
.pulse{animation:pulse 3.6s ease-in-out infinite}
.rotate{transform-box:fill-box;transform-origin:center;animation:rotate 32s linear infinite}
.dot{animation:particle 4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-208}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes rotate{to{transform:rotate(360deg)}}
@keyframes particle{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-9px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="960" height="330" fill="#fff"/>
<rect x="24" y="12" width="912" height="302" rx="18" fill="#f8f9fc"/><text x="44" y="43" fill="#c04a24" font-size="10" font-weight="400" class="mono">MOTION STUDY / 03</text><path d="M343.0 160H617.0" stroke="#ead8d1" stroke-width="2"/><path d="M343.0 160H617.0" stroke="#ef553d" stroke-width="3" class="flow"/><circle cx="348.0" cy="160" r="22" fill="#fff" stroke="#dbb6a6"/><circle cx="348.0" cy="160" r="8" fill="#c04a24" class="pulse" style="animation-delay:-0.0s"/><text x="348.0" y="209" fill="#67717e" font-size="9" font-weight="400" text-anchor="middle" letter-spacing="1">BUILD</text><circle cx="436.0" cy="160" r="22" fill="#fff" stroke="#dbb6a6"/><circle cx="436.0" cy="160" r="8" fill="#c04a24" class="pulse" style="animation-delay:-0.6s"/><text x="436.0" y="209" fill="#67717e" font-size="9" font-weight="400" text-anchor="middle" letter-spacing="1">TEST</text><circle cx="524.0" cy="160" r="22" fill="#fff" stroke="#dbb6a6"/><circle cx="524.0" cy="160" r="8" fill="#c04a24" class="pulse" style="animation-delay:-1.2s"/><text x="524.0" y="209" fill="#67717e" font-size="9" font-weight="400" text-anchor="middle" letter-spacing="1">DEPLOY</text><circle cx="612.0" cy="160" r="22" fill="#fff" stroke="#dbb6a6"/><circle cx="612.0" cy="160" r="8" fill="#c04a24" class="pulse" style="animation-delay:-1.7999999999999998s"/><text x="612.0" y="209" fill="#67717e" font-size="9" font-weight="400" text-anchor="middle" letter-spacing="1">WATCH</text><text x="480.0" y="285" fill="#67717e" font-size="11" font-weight="400" text-anchor="middle" letter-spacing="1.6">BUILD / TEST / DEPLOY / OBSERVE</text>
</svg>