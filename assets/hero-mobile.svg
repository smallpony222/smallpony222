<svg xmlns="http://www.w3.org/2000/svg" width="480" height="554" viewBox="0 0 480 554" role="img" aria-labelledby="title desc">
<title id="title">Small Pony — engineering in motion</title><desc id="desc">From code to systems to intelligence. Full-stack roots, systems thinking, applied AI.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#161d22"/><stop offset="1" stop-color="#0c1116"/></linearGradient>
 <linearGradient id="gold"><stop stop-color="#88734e"/><stop offset=".5" stop-color="#eddbb4"/><stop offset="1" stop-color="#ad9059"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#d9bd83" stop-opacity=".12"/><stop offset="1" stop-color="#d9bd83" stop-opacity="0"/></radialGradient>
</defs>
<style>
 text{font-family:Inter,'Segoe UI',Arial,sans-serif}
 .mono{font-family:'SFMono-Regular',Consolas,monospace;letter-spacing:2px}
 .signal{stroke-dasharray:12 140;animation:signal 9s linear infinite}
 .orbit{transform-box:fill-box;transform-origin:center;animation:orbit 40s linear infinite}
 .breathe{animation:breathe 6s ease-in-out infinite}
 .logo{animation:logo 7s ease-in-out infinite}
 .draw{stroke-dasharray:10 16;animation:signal 18s linear infinite}
 @keyframes signal{to{stroke-dashoffset:-304}}
 @keyframes orbit{to{transform:rotate(360deg)}}
 @keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
 @keyframes logo{0%,100%{opacity:.78;transform:translateY(0)}50%{opacity:1;transform:translateY(-1.5px)}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
 
</style>
<rect x=".5" y=".5" width="479" height="553" rx="22" fill="url(#bg)" stroke="#30373b"/>
<text x="28" y="46" fill="#d9bd83" font-size="12" font-weight="400" letter-spacing="2">SMALL PONY / ENGINEERING</text><path d="M28 70H452" stroke="#333a3e" /><text x="28" y="126" fill="#a5abae" font-size="11" font-weight="400" letter-spacing="1">SOFTWARE · SYSTEMS · DATA · AI</text><text x="25" y="205" fill="#f2eee5" font-size="49" font-weight="600" letter-spacing="-2">From code.</text><text x="25" y="270" fill="#f2eee5" font-size="49" font-weight="600" letter-spacing="-2">To systems.</text><text x="25" y="335" fill="#d9bd83" font-size="49" font-weight="600" letter-spacing="-2">To intelligence.</text><g transform="translate(366 432)"><circle r="58" fill="none" stroke="#3a4344"/><circle r="39" fill="none" stroke="#3a4344"/><g class="orbit"><circle r="58" fill="none" stroke="#d9bd83" stroke-width="2" stroke-dasharray="50 315"/></g><path d="M-16 0l-9 0 9-9M16 0h9l-9 9M6-13-6 13" stroke="#d9bd83" stroke-width="2" fill="none"/></g><text x="28" y="407" fill="#a5abae" font-size="13" font-weight="400" letter-spacing="1">FULL-STACK ROOTS.</text><text x="28" y="435" fill="#a5abae" font-size="13" font-weight="400" letter-spacing="1">SYSTEMS THINKING.</text><text x="28" y="463" fill="#a5abae" font-size="13" font-weight="400" letter-spacing="1">APPLIED INTELLIGENCE.</text><circle cx="32" cy="518" r="4" fill="#8bd2c6" class="breathe"/><text x="46" y="522" fill="#8bd2c6" font-size="11" font-weight="400" letter-spacing="1.5">STILL BUILDING / 2026</text>
</svg>